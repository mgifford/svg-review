async function raster(b64,size){const im=new Image();im.src='data:image/svg+xml;base64,'+b64;await im.decode();const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.clearRect(0,0,size,size);x.drawImage(im,0,0,size,size);return x.getImageData(0,0,size,size).data;}
async function cmp(a,b,size){const x=await raster(a,size),y=await raster(b,size);let diff=0,max=0,over8=0;for(let i=0;i<x.length;i+=4){const d=Math.max(Math.abs(x[i]-y[i]),Math.abs(x[i+1]-y[i+1]),Math.abs(x[i+2]-y[i+2]),Math.abs(x[i+3]-y[i+3]));if(d>0)diff++;if(d>8)over8++;if(d>max)max=d;}return {diff,maxDelta:max,over8};}
